<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- garante que o layout seja responsivo em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <!-- define o título da página exibido na aba do navegador -->
    <title>Trocador de Cores || Simples</title>
    <!-- importa o css do bootstrap para estilização -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- importa o arquivo CSS personalizado -->

<body>

    <nav>

            <h4><strong>Trocador de Cor</strong></h4>
            <!-- lista de links de navegação -->
            <ul class="nav-links">
                <li>
                    <!-- link para a página inicial -->

                </li>
                <li>
                    <!-- link para a página hex -->

                </li>
            </ul>
        </div>

                    #F1F5F8

                <div class="d-flex justify-content-center align-items-center">
